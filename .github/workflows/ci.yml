name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the package + classical tier + dev tools only. Torch /
      # transformers are intentionally excluded so CI stays fast; the network
      # and slow markers are deselected below.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" scikit-learn

      - name: Run tests (no network, no slow training)
        run: pytest -m "not network and not slow" -q
